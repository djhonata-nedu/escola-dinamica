<style>
  :root{
    --navy:#142F6B;
    --navy-deep:#0E2150;
    --royal:#1E4FC2;
    --royal-soft:#EAF0FC;
    --sun:#FFC400;
    --tangerine:#F47B20;
    --paper:#FFFFFF;
    --mist:#F5F8FD;
    --ink:#1B2440;
    --ink-soft:#5A6480;
    --line:#E3E9F4;
    --radius:18px;
    --shadow:0 18px 50px -18px rgba(14,33,80,.18);
    --font-display:'Montserrat',system-ui,sans-serif;
    --font-body:'Montserrat',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  *, *::before, *::after{min-width:0}
  body{overflow-x:clip}
  html{scroll-behavior:smooth}
  body{font-family:var(--font-body);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit}

  .wrap{max-width:1140px;margin:0 auto;padding:0 24px}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:76px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
  .brand img.sym{height:44px;width:auto}
  .brand img.wm{height:34px;width:auto}
  .nav-cta{display:inline-block;background:var(--royal);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;padding:11px 22px;border-radius:999px;transition:background .2s,transform .2s}
  .nav-cta:hover{background:var(--navy);transform:translateY(-1px)}

  .hero{padding:72px 0 64px;background:
    radial-gradient(1100px 520px at 85% -10%, var(--royal-soft) 0%, transparent 60%),
    var(--paper)}
  .hero-grid{max-width:720px}
  .eyebrow{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--royal)}
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--sun);border-radius:2px}
  h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.6rem,5.2vw,4rem);line-height:1.05;color:var(--navy);margin:18px 0 8px;letter-spacing:-.01em}
  .hero-sub{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:clamp(1.2rem,2.2vw,1.5rem);color:var(--tangerine);margin-bottom:22px}
  .hero-lede{font-size:1.06rem;color:var(--ink-soft);max-width:46ch;margin-bottom:28px}
  .hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:.9rem;font-weight:500;color:var(--navy)}
  .chip svg{flex:none}
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .btn-primary{display:inline-block;background:var(--royal);color:#fff;text-decoration:none;font-weight:700;font-size:1.02rem;padding:16px 32px;border-radius:999px;box-shadow:0 12px 28px -10px rgba(30,79,194,.5);transition:background .2s,transform .2s}
  .btn-primary:hover{background:var(--navy);transform:translateY(-2px)}
  .btn-ghost{display:inline-block;color:var(--navy);text-decoration:none;font-weight:600;font-size:.98rem;padding:16px 10px;border-bottom:2px solid transparent}
  .btn-ghost:hover{border-bottom-color:var(--sun)}
  .hero-note{margin-top:18px;font-size:.86rem;color:var(--ink-soft)}
  .hero-note strong{color:var(--tangerine)}


  .authority{background:var(--navy);color:#fff;padding:34px 0}
  .auth-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:center}
  .auth-item{display:flex;align-items:center;gap:14px;font-size:.94rem;line-height:1.4}
  .auth-item .num{font-family:var(--font-display);font-size:2rem;font-weight:600;color:var(--sun);line-height:1}
  .auth-item small{display:block;color:rgba(255,255,255,.72);font-size:.8rem;margin-top:2px}
  .auth-item strong{font-weight:600}
  .ib-slot{display:flex;align-items:center;gap:12px;justify-content:flex-end}
  .ib-slot .ib-logo-img{width:58px;height:58px;flex:none;border-radius:50%}

  section{padding:88px 0}
  .section-mist{background:var(--mist)}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--royal);margin-bottom:16px}
  .kicker::before{content:"";width:26px;height:2px;background:var(--sun);border-radius:2px}
  h2{font-family:var(--font-display);font-weight:700;font-size:clamp(1.9rem,3.4vw,2.6rem);line-height:1.15;color:var(--navy);letter-spacing:-.01em}
  h2 em{font-style:italic;color:var(--tangerine);font-weight:500}

  .about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:start}
  .about-copy p{margin:20px 0;color:var(--ink-soft);font-size:1.04rem}
  .about-copy p strong{color:var(--ink);font-weight:600}
  .detail-card{position:sticky;top:104px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .detail-card-head{background:var(--royal-soft);padding:22px 28px;border-bottom:1px solid var(--line)}
  .detail-card-head .t{font-family:var(--font-display);font-weight:600;font-size:1.2rem;color:var(--navy)}
  .detail-list{padding:10px 28px 22px;list-style:none}
  .detail-list li{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);font-size:.95rem}
  .detail-list li:last-child{border-bottom:none}
  .detail-list .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--royal-soft);display:flex;align-items:center;justify-content:center}
  .detail-list b{display:block;color:var(--navy);font-weight:600}
  .detail-list span.v{color:var(--ink-soft);font-size:.88rem}
  .detail-cta{display:block;margin:0 28px 26px;text-align:center;background:var(--royal);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:999px;transition:background .2s}
  .detail-cta:hover{background:var(--navy)}
  .scarcity{display:inline-flex;align-items:center;gap:8px;background:#FFF4E6;color:#B25008;border:1px solid #FFDDB8;font-size:.84rem;font-weight:600;padding:7px 14px;border-radius:999px;margin-top:14px}

  .journey-head{max-width:620px;margin-bottom:56px}
  .journey-head p{margin-top:14px;color:var(--ink-soft)}
  .timeline{position:relative;max-width:760px}
  .timeline::before{content:"";position:absolute;left:23px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--royal) 0%,var(--sun) 100%);border-radius:2px;opacity:.35}
  .stop{position:relative;display:grid;grid-template-columns:48px 130px 1fr;gap:24px;padding:26px 0;align-items:start}
  .stop + .stop{border-top:1px solid var(--line)}
  .stop-dot{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;background:var(--paper);border:2px solid var(--royal);display:flex;align-items:center;justify-content:center}
  .stop-dot::after{content:"";width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--sun) 0 50%,var(--tangerine) 50% 100%)}
  .stop-time{font-weight:700;color:var(--navy);font-size:.95rem;padding-top:11px}
  .stop-time small{display:block;font-weight:500;color:var(--ink-soft)}
  .stop-body{padding-top:8px}
  .stop-body h3{font-family:var(--font-display);font-weight:600;font-size:1.25rem;color:var(--navy);margin-bottom:4px}
  .stop-body p{color:var(--ink-soft);font-size:.97rem}

  .proof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:52px}
  .proof-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;transition:transform .2s,box-shadow .2s}
  .proof-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .proof-card .pi{width:46px;height:46px;border-radius:12px;background:var(--royal-soft);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .proof-card h3{font-family:var(--font-display);font-weight:600;font-size:1.15rem;color:var(--navy);margin-bottom:8px}
  .proof-card p{color:var(--ink-soft);font-size:.94rem}

  .rsvp{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff}
  .rsvp-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:start}
  .rsvp .kicker{color:var(--sun)}
  .rsvp h2{color:#fff}
  .rsvp-side p{color:rgba(255,255,255,.78);margin-top:18px;font-size:1.02rem;max-width:42ch}
  .rsvp-points{list-style:none;margin-top:30px;display:grid;gap:14px}
  .rsvp-points li{display:flex;gap:12px;align-items:flex-start;font-size:.96rem;color:rgba(255,255,255,.9)}
  .rsvp-points svg{flex:none;margin-top:3px}
  .form-card{background:var(--paper);color:var(--ink);border-radius:24px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);padding:40px}
  .form-card h3{font-family:var(--font-display);font-weight:600;font-size:1.45rem;color:var(--navy)}
  .form-card .fc-sub{color:var(--ink-soft);font-size:.92rem;margin:6px 0 26px}
  .field{margin-bottom:18px}
  .field label{display:block;font-weight:600;font-size:.88rem;color:var(--navy);margin-bottom:7px}
  .field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font:inherit;font-size:.97rem;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  .field input:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px rgba(30,79,194,.14)}
  .radio-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .radio-pill input{position:absolute;opacity:0}
  .radio-pill span{display:block;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:.92rem;font-weight:500;cursor:pointer;transition:all .15s}
  .radio-pill input:checked + span{border-color:var(--royal);background:var(--royal-soft);color:var(--royal);font-weight:600}
  .radio-pill input:focus-visible + span{box-shadow:0 0 0 3px rgba(30,79,194,.25)}
  .unit-grid{display:grid;gap:10px}
  .unit-opt input{position:absolute;opacity:0}
  .unit-opt span.box{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;font-size:.95rem;cursor:pointer;transition:all .15s}
  .unit-opt b{font-weight:600;color:var(--navy)}
  .unit-opt small{color:var(--ink-soft);font-weight:500}
  .unit-opt input:checked + span.box{border-color:var(--royal);background:var(--royal-soft)}
  .unit-opt input:focus-visible + span.box{box-shadow:0 0 0 3px rgba(30,79,194,.25)}
  .age-alert{display:none;background:#FFF4E6;border:1px solid #FFDDB8;color:#8a4a10;border-radius:12px;padding:14px 16px;font-size:.88rem;margin-top:-6px;margin-bottom:18px}
  .age-alert a{color:#B25008;font-weight:600}
  .form-submit{width:100%;border:none;background:var(--tangerine);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;padding:17px;border-radius:999px;cursor:pointer;margin-top:8px;transition:background .2s,transform .2s;box-shadow:0 12px 28px -10px rgba(244,123,32,.55)}
  .form-submit:hover{background:#D9660E;transform:translateY(-2px)}
  .form-submit:disabled{background:#cfd6e6;box-shadow:none;cursor:not-allowed;transform:none}
  .lgpd{font-size:.76rem;color:var(--ink-soft);margin-top:16px;line-height:1.5}
  .form-success{display:none;text-align:center;padding:30px 10px}
  .form-success .ok{width:74px;height:74px;border-radius:50%;background:var(--royal-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  .form-success h3{margin-bottom:10px}
  .form-success p{color:var(--ink-soft);font-size:.96rem}

  footer{background:var(--navy-deep);color:rgba(255,255,255,.78);padding:56px 0 36px;font-size:.9rem}
  .foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
  .foot-brand{display:flex;align-items:center;gap:12px}
  .foot-brand img{height:46px}
  .foot-brand .fb-name{font-weight:700;color:#fff;font-size:1.05rem;line-height:1.2}
  .foot-brand .fb-name small{display:block;font-weight:500;color:rgba(255,255,255,.6);font-size:.8rem}
  footer h4{color:var(--sun);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
  footer p{line-height:1.55}

<script>
  // Aplica o PAINEL DE TEXTOS aos elementos da página
  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.dataset.t;
    if (TEXTOS[k] !== undefined) el.innerHTML = TEXTOS[k];
  });

  // Reveal on scroll
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  // Player (placeholder até o vídeo institucional ser plugado)

  // Age gate inline
  const ageAlert = document.getElementById('ageAlert');
  const submitBtn = document.getElementById('submitBtn');
  document.querySelectorAll('input[name="idade"]').forEach(r => r.addEventListener('change', e => {
    const fora = e.target.value === 'fora';
    ageAlert.style.display = fora ? 'block' : 'none';
    submitBtn.disabled = fora;
  }));

  // Mascara telefone
  document.getElementById('tel').addEventListener('input', function () {
    let v = this.value.replace(/D/g, '').slice(0, 11);
    if (v.length > 10) v = v.replace(/^(d{2})(d{5})(d{4})$/, '($1) $2-$3');
    else if (v.length > 6) v = v.replace(/^(d{2})(d{4})(d*)$/, '($1) $2-$3');
    else if (v.length > 2) v = v.replace(/^(d{2})(d*)$/, '($1) $2');
    this.value = v;
  });

  // Submit — Apps Script + Meta Pixel
  document.getElementById('rsvpForm').addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target;
    if (!form.checkValidity()){ form.reportValidity(); return; }

    const nome    = document.getElementById('nome').value.trim();
    const email   = document.getElementById('email').value.trim();
    const tel     = document.getElementById('tel').value.trim();
    const unidade = (document.querySelector('input[name="unidade"]:checked') || {}).value || '';

    // Google Sheets
    fetch('https://script.google.com/macros/s/AKfycbwdtZhJYe00WWhpC_sz-HsVF7Wb92RATn3PB51BuDSwyvhlnfMz5pmY6vnh-9djTM839w/exec', {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, email, telefone: tel, unidade })
    });

    // Meta Pixel
    fbq('track', 'Lead', { content_name: unidade });
    var qMap = { centro: 'QualifiedLead Centro', jurere: 'QualifiedLead Jurere', primavera: 'QualifiedLead Primavera' };
    if (qMap[unidade]) fbq('trackCustom', qMap[unidade]);

    form.style.display = 'none';
    document.getElementById('formSuccess').style.display = 'block';
  });
</script>
